name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 for the Paper bridge
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Record bridge toolchain
        run: echo "BRIDGE_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: bash ./gradlew build --no-daemon --max-workers=2 -Porg.gradle.java.installations.paths="$BRIDGE_JAVA_HOME,$JAVA_HOME"

      - name: Upload plugin jars
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: VelocityPlayerSync-build-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error

  release:
    needs: build
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built plugin jars
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}-{1}', github.run_number, github.run_attempt) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}.{1}', github.run_number, github.run_attempt) }}
          target_commitish: ${{ github.sha }}
          files: dist/*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
